<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" href="foto2.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Debora</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --cor-fundo: #fff0f3; --cor-envelope: #ff4d6d; --cor-texto: #800e13; --cor-papel: #ffffff; }
        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: var(--cor-fundo); overflow-x: hidden; transition: background 1s; }
        body.dark-mode { background: #050505; }
        canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1; }

        /* SEÇÕES */
        #secao-cartinha, #secao-mural { width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10; }
        #secao-mural { display: none; padding: 20px 20px 100px 20px; box-sizing: border-box; justify-content: flex-start; }

        /* CARTINHA */
        h1 { font-size: 1.4rem; color: var(--cor-texto); text-align: center; margin-bottom: 25px; font-weight: 800; transition: color 1s; }
        .dark-mode h1 { color: #fff; text-shadow: 0 0 10px #ff4d6d; }
        .envelope-wrapper { position: relative; width: 320px; height: 200px; cursor: pointer; background: #ff4d6d; border-radius: 0 0 15px 15px; }
        .envelope-wrapper::before { content: ''; position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 160px solid transparent; border-right: 160px solid transparent; border-top: 110px solid #ff4d6d; z-index: 15; transition: transform 0.5s; transform-origin: top; }
        .envelope-wrapper.open::before { transform: rotateX(180deg); z-index: 2; }
        .message-box { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 280px; height: 160px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 15px; font-weight: 600; opacity: 0; transition: transform 0.7s, opacity 0.4s; z-index: 6; box-sizing: border-box; color: var(--cor-texto); }
        .envelope-wrapper.open .message-box { transform: translateX(-50%) translateY(-130px); opacity: 1; }

        /* MURAL */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 800px; margin-top: 20px; }
        .photo-card { background: white; padding: 8px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; text-align: center; }
        .photo-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; filter: sepia(80%) blur(3px); transition: filter 1s; }
        .photo-card.revelada img { filter: sepia(0%) blur(0px); }
        .photo-card p { font-family: 'Caveat', cursive; font-size: 1.2rem; margin: 8px 0 0 0; opacity: 0; transition: opacity 1s; }
        .photo-card.revelada p { opacity: 1; }

        /* BOTÕES */
        #btnMural, #btnVoltar { padding: 12px 30px; background: #ff4d6d; color: white; border: none; border-radius: 25px; font-weight: 800; cursor: pointer; margin-top: 20px; display: none; box-shadow: 0 4px 10px rgba(255,77,109,0.4); }
        #btnVoltar { position: fixed; bottom: 20px; display: none; z-index: 100; }

        /* TRAIL & FOTOS VIVAS */
        .trail-photo { position: fixed; pointer-events: none; z-index: 9999; width: 35px; height: 35px; border-radius: 5px; border: 2px solid white; animation: moveUp 1s forwards; }
        @keyframes moveUp { 100% { transform: translateY(-50px); opacity: 0; } }
        .foto-viva { position: fixed; pointer-events: none; z-index: 3; border-radius: 10px; animation: floatUp linear forwards; }
        @keyframes floatUp { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }

        .rgb { font-weight: 800; background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: rgb-anim 3s linear infinite; }
        @keyframes rgb-anim { to { background-position: 200% center; } }
    </style>
</head>
<body>

<audio id="musica" src="505.mp3" preload="auto" loop></audio>
<canvas id="canvas"></canvas>

<div id="secao-cartinha">
    <h1 id="titulo">Estou aqui para te lembrar disso</h1>
    <div id="envelope" class="envelope-wrapper" onclick="proximaMensagem()">
        <div class="message-box" id="msg"></div>
    </div>
    <button id="btnMural" onclick="irParaMural()">Ver Mural de Fotos</button>
</div>

<div id="secao-mural">
    <h1 style="color: #ff4d6d">Mural da Garota mais Linda</h1>
    <div class="grid">
        <div class="photo-card" onclick="revelar(this)"><img src="mural1.jpeg"><p>O olhar...</p></div>
        <div class="photo-card" onclick="revelar(this)"><img src="mural2.jpeg"><p>As expressões...</p></div>
        <div class="photo-card" onclick="revelar(this)"><img src="mural3.jpeg"><p>O jeitinho...</p></div>
        <div class="photo-card" onclick="revelar(this)"><img src="mural4.jpeg"><p>O outro jeitinho...</p></div>
        <div class="photo-card" onclick="revelar(this)"><img src="mural5.jpeg"><p>O corpão...</p></div>
        <div class="photo-card" onclick="revelar(this)"><img src="mural6.jpg"><p>A fofura...</p></div>
    </div>
    <button id="btnVoltar" onclick="irParaCartinha()">Voltar à Cartinha</button>
</div>

<script>
    const msgList = [
        "Você é absurdamente<br><span class='rgb'>LINDA...</span>",
        "Você é absurdamente<br><span class='rgb'>ESPECIAL...</span>",
        "Você é a pessoa mais<br><span class='rgb'>INCRÍVEL</span> que conheço...",
        "Você merece toda a<br><span class='rgb'>PAZ</span> do mundo...",
        "Você simplesmente merece<br><span class='rgb'>TUDO...</span>",
        "<span class='rgb'>Feliz Aniversário!!!!</span>"
    ];

    let currentIdx = 0, bdayMode = false, trailIdx = 0;
    const musica = document.getElementById('musica');

    function proximaMensagem() {
        if (bdayMode) return;
        const env = document.getElementById('envelope');
        const msgDiv = document.getElementById('msg');
        
        if (env.classList.contains('open')) {
            env.classList.remove('open');
            setTimeout(() => {
                currentIdx++;
                if (currentIdx >= msgList.length) currentIdx = msgList.length - 1;
                msgDiv.innerHTML = msgList[currentIdx];
                if (currentIdx === msgList.length - 1) ativarBday();
                else env.classList.add('open');
            }, 500);
        } else {
            msgDiv.innerHTML = msgList[currentIdx];
            env.classList.add('open');
        }
    }

    function ativarBday() {
        bdayMode = true;
        document.body.classList.add('dark-mode');
        document.getElementById('titulo').innerText = "Parabéns, Dedé!";
        document.getElementById('envelope').classList.add('open');
        document.getElementById('btnMural').style.display = 'block';
        musica.play();
        setInterval(spawnPhoto, 1500);
    }

    function spawnPhoto() {
        if (document.querySelectorAll('.foto-viva').length > 5) return;
        const img = document.createElement('img');
        img.src = ['foto.png', 'foto2.png', 'foto3.png'][Math.floor(Math.random()*3)];
        img.className = 'foto-viva';
        img.style.left = Math.random()*80 + 'vw';
        img.style.width = '50px';
        img.style.animationDuration = (Math.random()*3 + 4) + 's';
        document.body.appendChild(img);
        img.addEventListener('animationend', () => img.remove());
    }

    function irParaMural() {
        document.getElementById('secao-cartinha').style.display = 'none';
        document.getElementById('secao-mural').style.display = 'flex';
        document.getElementById('btnVoltar').style.display = 'block';
        window.scrollTo(0,0);
    }

    function irParaCartinha() {
        document.getElementById('secao-mural').style.display = 'none';
        document.getElementById('secao-cartinha').style.display = 'flex';
        document.getElementById('btnVoltar').style.display = 'none';
    }

    function revelar(el) { el.classList.add('revelada'); }

    // Rastro de fotos
    document.addEventListener('touchmove', (e) => {
        if (!bdayMode) return;
        const t = e.touches[0];
        const img = document.createElement('img');
        img.src = ['foto.png', 'foto2.png', 'foto3.png'][trailIdx++ % 3];
        img.className = 'trail-photo';
        img.style.left = t.clientX + 'px'; img.style.top = t.clientY + 'px';
        document.body.appendChild(img);
        setTimeout(() => img.remove(), 1000);
    }, {passive: true});

    // Canvas simplificado para não pesar
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    function anim() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        if (bdayMode) {
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            if (Math.random() > 0.9) ctx.fillText("✨", Math.random()*canvas.width, Math.random()*canvas.height);
        }
        requestAnimationFrame(anim);
    }
    anim();
</script>
</body>
</html>
