<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" href="foto2.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Debora</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-fundo: #fff0f3;
            --cor-envelope: #ff4d6d;
            --cor-envelope-claro: #ff8fa3;
            --cor-texto: #800e13;
            --cor-papel: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: var(--cor-fundo);
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
            transition: background 1.5s ease; -webkit-font-smoothing: antialiased;
        }

        body.dark-mode { background: #050505; }
        canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1; }

        #secao-cartinha, #secao-mural {
            position: relative; z-index: 10; width: 100%; display: flex; flex-direction: column; align-items: center;
        }

        #secao-cartinha { 
            padding: 40px 0; 
            box-sizing: border-box;
            justify-content: center;
            min-height: 100vh;
        }

        #secao-mural { display: none; padding: 40px 20px 120px 20px; justify-content: flex-start; min-height: 100vh; box-sizing: border-box; }

        h1 { 
            font-size: clamp(1.1rem, 5vw, 1.3rem); 
            color: var(--cor-texto); text-align: center; 
            margin: 0;
            font-weight: 800; 
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 1s;
            z-index: 20;
        }
        .dark-mode h1 { color: #fff; animation: glow 1.5s ease-in-out infinite alternate; }

        .envelope-wrapper {
            position: relative; width: 380px; height: 240px; cursor: pointer;
            background: linear-gradient(135deg, var(--cor-envelope-claro), var(--cor-envelope));
            border-radius: 0 0 15px 15px; box-shadow: 0 20px 40px rgba(255, 77, 109, 0.4);
            z-index: 5;
            margin-top: 15px;
        }
        
        .envelope-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 0; height: 0;
            border-left: 190px solid transparent; border-right: 190px solid transparent;
            border-top: 140px solid var(--cor-envelope); z-index: 15; transition: transform 0.5s ease; transform-origin: top;
        }
        .envelope-wrapper.open::before { transform: rotateX(180deg); z-index: 2; }

        .envelope-sides { 
            position: absolute; bottom: 0; left: 0; width: 0; height: 0; 
            border-left: 190px solid rgba(255, 143, 163, 0.9); 
            border-right: 190px solid rgba(255, 143, 163, 0.9); 
            border-top: 120px solid transparent; 
            border-bottom: 120px solid var(--cor-envelope); 
            border-radius: 0 0 15px 15px; z-index: 10; 
        }

        .message-box {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 330px; height: 200px; background: var(--cor-papel); border-radius: 8px;
            padding: 10px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center;
            color: var(--cor-texto); font-weight: 600; font-size: 1.1rem; 
            line-height: 1.1; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 6; opacity: 0; transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s; 
            box-sizing: border-box;
            overflow: hidden;
        }

        .envelope-wrapper.open .message-box { transform: translateX(-50%) translateY(-185px); opacity: 1; }

        #instrucao {
            font-size: 1rem;
            color: #b33951; 
            font-family: 'Montserrat', sans-serif;
            margin-top: 25px; 
            font-weight: 800;
            opacity: 0.9;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .rgb { 
            display: inline-block;
            margin: 2px 0;
            font-weight: 800; 
            font-size: 1.35rem;
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            background-size: 200% auto; animation: rgb-anim 3s linear infinite; 
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .photo-card { background: white; padding: 12px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; text-align: center; }
        .photo-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; filter: sepia(80%) blur(5px); transition: filter 1.5s; }
        .photo-card.revelada img { filter: sepia(0%) blur(0px); }
        .photo-card p { font-family: 'Caveat', cursive; font-size: 1.4rem; margin: 10px 0 0 0; opacity: 0; transition: opacity 1.5s; }
        .photo-card.revelada p { opacity: 1; }
        .texto-final-mural { font-family: 'Caveat', cursive; font-size: 2.2rem; color: #ff4d6d; text-align: center; margin-top: 50px; margin-bottom: 20px; padding: 0 20px; opacity: 0.9; }

        #btnMural, #btnVoltar { padding: 12px 35px; background: #ff4d6d; color: white; border: none; border-radius: 25px; font-weight: 800; cursor: pointer; margin-top: 30px; display: none; box-shadow: 0 5px 15px rgba(255,77,109,0.4); }
        #btnVoltar { position: fixed; bottom: 30px; display: none; z-index: 100; }

        .foto-viva { position: fixed; z-index: 3; pointer-events: none; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: floatUp linear forwards; }
        @keyframes floatUp { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }
        .trail-element { position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); animation: moveUpFade 1s linear forwards; }
        @keyframes moveUpFade { 100% { transform: translate(-50%, -100px) scale(0.3); opacity: 0; } }
        .trail-photo { width: 40px; height: 40px; border-radius: 8px; border: 2px solid white; object-fit: cover; }
        .trail-heart { color: #ff4d6d; font-size: 20px; }

        @keyframes rgb-anim { to { background-position: 200% center; } }
        @keyframes glow { from { text-shadow: 0 0 10px #ff4d6d; } to { text-shadow: 0 0 20px #ff758f, 0 0 30px #ff4d6d; } }
    </style>
</head>
<body>

<audio id="musica" src="505.mp3" preload="auto" loop></audio>
<canvas id="mainCanvas"></canvas>

<div id="secao-cartinha">
    <h1 id="titulo">Estou aqui para te lembrar disso</h1>
    <div id="envelope" class="envelope-wrapper" onclick="handleSurprise()">
        <div class="envelope-sides"></div>
        <div id="msg" class="message-box"></div>
    </div>
    <p id="instrucao">Clique na cartinha para abrir</p>
    <button id="btnMural" onclick="irMural()">Ver Mural de Fotos</button>
</div>

<div id="secao-mural">
    <h1 style="color: #ff4d6d; font-size: 32px; font-weight: 800; margin-bottom: 20px;">Mural da Garota mais Linda ❤️</h1>
    <div class="grid">
        <div class="photo-card" onclick="this.classList.add('revelada')"><img src="mural1.jpeg"><p>O olhar...</p></div>
        <div class="photo-card" onclick="this.classList.add('revelada')"><img src="mural2.jpeg"><p>As expressões...</p></div>
        <div class="photo-card" onclick="this.classList.add('revelada')"><img src="mural3.jpeg"><p>O jeitinho...</p></div>
        <div class="photo-card" onclick="this.classList.add('revelada')"><img src="mural4.jpeg"><p>O outro jeitinho...</p></div>
        <div class="photo-card" onclick="this.classList.add('revelada')"><img src="mural5.jpeg"><p>O corpão...</p></div>
        <div class="photo-card" onclick="this.classList.add('revelada')"><img src="mural6.jpg"><p>A fofura...</p></div>
    </div>
    <button id="btnVoltar" onclick="irCartinha()">Voltar à Cartinha</button>
</div>

<script>
    const memorias = [
            "Você é absurdamente<br><span class='rgb'>LINDA...</span>",
            "Você é absurdamente<br><span class='rgb'>ESPECIAL...</span>",
            "Você é a pessoa mais<br><span class='rgb'>INCRÍVEL</span> que conheço...",
            "Você é a pessoa mais<br><span class='rgb'>PERFEITA</span> que conheço...",
            "Você merece toda<br><span class='rgb'>FELICIDADE</span> do mundo nessa vida...",
            "Você merece toda a<br><span class='rgb'>PAZ</span> do mundo nessa vida...",
            "Você merece tudo o que é<br><span class='rgb'>BOM</span> nessa vida...",
            "Você merece tudo o que te faz<br><span class='rgb'>BEM</span> nessa vida...",
            "Você simplesmente merece<br><span class='rgb'>TUDO...</span>",
            "<span class='rgb'>Feliz Aniversário!!!!</span>"
    ];

    let index = 0, bdayMode = false, trailIndex = 0, lastTrailTime = 0;
    const musica = document.getElementById('musica'), canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');
    let parts = [], fworks = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    function handleSurprise() {
        if (bdayMode) return;
        const env = document.getElementById('envelope'), box = document.getElementById('msg'), tit = document.getElementById('titulo'), ins = document.getElementById('instrucao');
        
        const saltoTitulo = "-130px";

        if (env.classList.contains('open')) {
            env.classList.remove('open');
            tit.style.transform = "translateY(0)";
            setTimeout(() => {
                index++;
                if (index < memorias.length) {
                    box.innerHTML = memorias[index];
                    env.classList.add('open');
                    tit.style.transform = `translateY(${saltoTitulo})`;
                    
                    if (index >= 9) ins.style.display = 'none';
                    if (index === memorias.length - 1) ativarModoBday();
                }
            }, 500);
        } else {
            box.innerHTML = memorias[index];
            env.classList.add('open');
            tit.style.transform = `translateY(${saltoTitulo})`;
            if (index >= 9) ins.style.display = 'none';
        }
    }

    function ativarModoBday() {
        bdayMode = true;
        musica.play().catch(() => {});
        document.body.classList.add('dark-mode');
        
        // AJUSTES DE ESPAÇAMENTO NA TELA FINAL
        const tit = document.getElementById('titulo');
        const box = document.getElementById('msg');
        
        tit.innerText = "Parabéns, Dedéeeee!";
        tit.style.transform = "translateY(-135px)"; // Sobe o título um pouco mais
        box.style.transform = "translateX(-50%) translateY(-170px)"; // Papel fica um pouco mais baixo
        
        box.innerHTML = "<span class='rgb'>Feliz Aniversário!!!</span>";
        document.getElementById('btnMural').style.display = 'block';
        setInterval(spawnPhoto, 1000);
    }

    function spawnPhoto() {
        if (document.querySelectorAll('.foto-viva').length > 8) return;
        const img = document.createElement('img');
        img.src = ['foto.png', 'foto2.png', 'foto3.png'][Math.floor(Math.random()*3)];
        img.className = 'foto-viva';
        img.style.left = Math.random()*85 + 'vw';
        img.style.width = (Math.random()*30 + 40) + 'px';
        img.style.animationDuration = (Math.random()*3 + 5) + 's';
        document.body.appendChild(img);
        img.addEventListener('animationend', () => img.remove());
    }

    function irMural() {
        document.getElementById('secao-cartinha').style.display = 'none';
        document.getElementById('secao-mural').style.display = 'flex';
        document.getElementById('btnVoltar').style.display = 'block';
        window.scrollTo(0,0);
    }

    function irCartinha() {
        document.getElementById('secao-mural').style.display = 'none';
        document.getElementById('secao-cartinha').style.display = 'flex';
        document.getElementById('btnVoltar').style.display = 'none';
    }

    function createTrail(x, y) {
        const now = Date.now(); if (now - lastTrailTime < 350) return; lastTrailTime = now;
        const el = document.createElement(bdayMode ? 'img' : 'div');
        el.className = 'trail-element';
        if (bdayMode) { el.src = ['foto.png', 'foto2.png', 'foto3.png'][trailIndex++ % 3]; el.classList.add('trail-photo'); } 
        else { el.innerHTML = '❤️'; el.classList.add('trail-heart'); }
        el.style.left = x + 'px'; el.style.top = y + 'px';
        document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
    }
    document.addEventListener('mousemove', (e) => createTrail(e.clientX, e.clientY));
    document.addEventListener('touchmove', (e) => createTrail(e.touches[0].clientX, e.touches[0].clientY), {passive: true});

    class Firework {
        constructor() { this.x = Math.random()*canvas.width; this.y = canvas.height; this.vel = Math.random()*-8-7; this.color = `hsl(${Math.random()*360}, 100%, 60%)`; this.exp = false; }
        update() { this.y += this.vel; this.vel += 0.15; if(this.vel >= 0 && !this.exp) { this.exp = true; for(let i=0; i<40; i++) parts.push(new Particle(this.x, this.y, this.color)); } }
        draw() { if(!this.exp) { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill(); } }
    }
    class Particle {
        constructor(x,y,c) { this.x = x; this.y = y; this.c = c; this.vx = Math.random()*4-2; this.vy = Math.random()*4-2; this.op = 1; }
        update() { this.x += this.vx; this.y += this.vy; this.vy += 0.1; this.op -= 0.015; }
        draw() { ctx.globalAlpha = this.op; ctx.fillStyle = this.c; ctx.beginPath(); ctx.arc(this.x, this.y, 1.5, 0, Math.PI*2); ctx.fill(); }
    }

    function loop() {
        ctx.fillStyle = bdayMode ? 'rgba(5,5,5,0.2)' : 'rgba(255, 240, 243, 1)';
        if(!bdayMode) ctx.clearRect(0,0,canvas.width, canvas.height); else ctx.fillRect(0,0,canvas.width, canvas.height);
        if(bdayMode && Math.random() < 0.05) fworks.push(new Firework());
        for(let i=fworks.length-1; i>=0; i--) { fworks[i].update(); fworks[i].draw(); if(fworks[i].exp && parts.length === 0) fworks.splice(i,1); }
        for(let i=parts.length-1; i>=0; i--) { parts[i].update(); parts[i].draw(); if(parts[i].op<=0) parts.splice(i,1); }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
